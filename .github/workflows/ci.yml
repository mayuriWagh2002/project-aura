name: CI

# Sprint 0A scope only (Engineering Architecture, Part 11, Milestone 1):
# lint + type-check. Content validation, automated accessibility checks,
# and Lighthouse CI (Part 10) are added in later milestones as the
# corresponding content model, pages, and interactions come online.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check
